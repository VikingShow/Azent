loops:
  code-review:
    name: "标准开发流程"
    allowModification: true
    phases:
      - id: analyze
        name: "需求分析与架构设计"
        acceptance: "产出了清晰的问题摘要、实现步骤列表和风险识别，每一步有明确的预期结果"
        agent: architect
      - id: implement
        name: "编码实现"
        acceptance: "所有计划步骤已实现，代码通过 lint 和类型检查，无编译错误"
        agent: coder
      - id: review
        name: "代码审查"
        acceptance: "Reviewer 返回 PASS，或 NEEDS_CHANGES 且所有 major 以上问题已修复"
        agent: reviewer
      - id: test
        name: "测试验证"
        acceptance: "新增/修改代码的测试全部通过，无失败用例"
        agent: tester

  new-feature:
    name: "新功能开发"
    allowModification: true
    phases:
      - id: design
        name: "功能设计"
        acceptance: "设计方案明确包含：用户故事、技术方案、接口定义、数据结构、与现有系统的集成点"
        agent: architect
      - id: implement
        name: "功能实现"
        acceptance: "核心功能代码完成，通过类型检查，无 lint 错误"
        agent: coder
      - id: review
        name: "代码审查"
        acceptance: "Reviewer 返回 PASS 或所有 major 问题已修复"
        agent: reviewer
      - id: test
        name: "测试编写与运行"
        acceptance: "单元测试覆盖率 >= 80%，所有测试通过"
        agent: tester

  quick-fix:
    name: "快速修复"
    allowModification: false
    phases:
      - id: diagnose
        name: "问题诊断"
        acceptance: "已定位到根本原因，能清晰复现问题路径"
        agent: debugger
      - id: fix
        name: "修复实施"
        acceptance: "最小修复已应用，修复代码通过类型检查"
        agent: coder
      - id: verify
        name: "修复验证"
        acceptance: "原始问题不再复现，无回归问题"
        agent: tester

  debug:
    name: "调试排障"
    allowModification: true
    phases:
      - id: reproduce
        name: "复现问题"
        acceptance: "能稳定复现问题，记录了复现步骤和环境信息"
        agent: debugger
      - id: diagnose
        name: "根因分析"
        acceptance: "找到了根本原因，可清晰解释问题发生机制"
        agent: debugger
      - id: fix
        name: "修复"
        acceptance: "最小修复已应用，不引入新问题"
        agent: coder
      - id: review
        name: "修复审查"
        acceptance: "修复方式正确，无副作用，Reviewer 返回 PASS"
        agent: reviewer
      - id: verify
        name: "回归验证"
        acceptance: "原问题已解决，相关测试全部通过"
        agent: tester

  refactor:
    name: "重构优化"
    allowModification: true
    phases:
      - id: assess
        name: "现状评估"
        acceptance: "识别了代码异味/问题点，定义了重构目标和不变量（行为不变）"
        agent: architect
      - id: refactor
        name: "重构实施"
        acceptance: "重构完成，代码通过类型检查和 lint"
        agent: coder
      - id: verify
        name: "行为验证"
        acceptance: "现有测试全部通过（无行为变化），测试覆盖率不降"
        agent: tester
      - id: review
        name: "质量审查"
        acceptance: "重构提升了可读性/可维护性，无过度设计，Reviewer 返回 PASS"
        agent: reviewer
